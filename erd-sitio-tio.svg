<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Sitio Tio Database ERD</title>
  <desc id="desc">Entity relationship diagram for the Sitio Tio hotel reservation database.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .edge-label { fill: #475569; font: 12px Arial, sans-serif; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .head { fill: #0f766e; rx: 10; }
      .head-text { fill: #ffffff; font: bold 15px Arial, sans-serif; }
      .field { fill: #334155; font: 12px Consolas, monospace; }
      .pk { fill: #0f766e; font: bold 12px Consolas, monospace; }
      .fk { fill: #7c3aed; font: 12px Consolas, monospace; }
      .note { fill: #64748b; font: 13px Arial, sans-serif; }
      .title { fill: #0f172a; font: bold 28px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1160"/>
  <text class="title" x="60" y="52">Sitio Tio - Entity Relationship Diagram</text>
  <text class="note" x="60" y="78">PK = primary key, FK = foreign key, UK = unique key</text>

  <!-- Relationships -->
  <path class="edge" d="M310 245 H400"/>
  <text class="edge-label" x="325" y="235">creates 1:N</text>
  <path class="edge" d="M310 590 H400"/>
  <text class="edge-label" x="325" y="580">pays 1:N</text>
  <path class="edge" d="M310 760 H400"/>
  <text class="edge-label" x="322" y="750">writes 1:N</text>
  <path class="edge" d="M755 230 H850"/>
  <text class="edge-label" x="770" y="220">has 1:N</text>
  <path class="edge" d="M755 310 H850"/>
  <text class="edge-label" x="767" y="300">has 1:N</text>
  <path class="edge" d="M755 390 H850"/>
  <text class="edge-label" x="767" y="380">has 1:N</text>
  <path class="edge" d="M755 590 H850"/>
  <text class="edge-label" x="770" y="580">has 1:N</text>
  <path class="edge" d="M1080 390 V495"/>
  <text class="edge-label" x="1090" y="450">uses 1:N</text>
  <path class="edge" d="M1080 650 V760"/>
  <text class="edge-label" x="1090" y="715">has 1:N</text>
  <path class="edge" d="M620 690 V760"/>
  <text class="edge-label" x="630" y="730">reviewed 1:N</text>
  <path class="edge" d="M1060 940 H1260"/>
  <text class="edge-label" x="1110" y="930">applied 1:N</text>
  <path class="edge" d="M755 470 H850"/>
  <text class="edge-label" x="765" y="460">maps N:M</text>
  <path class="edge" d="M1260 470 H1180"/>
  <text class="edge-label" x="1188" y="460">maps N:M</text>

  <!-- users -->
  <g transform="translate(60 120)">
    <rect class="box" width="250" height="190"/>
    <rect class="head" width="250" height="34"/>
    <text class="head-text" x="15" y="22">users</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="field" x="15" y="78">name</text>
    <text class="field" x="15" y="99">email (UK)</text>
    <text class="field" x="15" y="120">phone, address</text>
    <text class="field" x="15" y="141">role: admin | customer</text>
    <text class="field" x="15" y="162">email_verified_at, password</text>
  </g>

  <!-- rooms -->
  <g transform="translate(500 120)">
    <rect class="box" width="255" height="215"/>
    <rect class="head" width="255" height="34"/>
    <text class="head-text" x="15" y="22">rooms</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="field" x="15" y="78">name, slug</text>
    <text class="field" x="15" y="99">description, capacity</text>
    <text class="field" x="15" y="120">price, room_stock</text>
    <text class="field" x="15" y="141">status, bed_type</text>
    <text class="field" x="15" y="162">image, size</text>
    <text class="field" x="15" y="183">created_at, updated_at</text>
  </g>

  <!-- room units -->
  <g transform="translate(850 140)">
    <rect class="box" width="230" height="145"/>
    <rect class="head" width="230" height="34"/>
    <text class="head-text" x="15" y="22">room_units</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="fk" x="15" y="78">FK room_id</text>
    <text class="field" x="15" y="99">room_number (UK)</text>
    <text class="field" x="15" y="120">status: available | occupied</text>
    <text class="field" x="15" y="137">        | maintenance</text>
  </g>

  <!-- facilities -->
  <g transform="translate(1260 120)">
    <rect class="box" width="235" height="135"/>
    <rect class="head" width="235" height="34"/>
    <text class="head-text" x="15" y="22">facilities</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="field" x="15" y="78">name</text>
    <text class="field" x="15" y="99">icon</text>
    <text class="field" x="15" y="120">description</text>
  </g>

  <!-- bookings -->
  <g transform="translate(400 400)">
    <rect class="box" width="355" height="285"/>
    <rect class="head" width="355" height="34"/>
    <text class="head-text" x="15" y="22">bookings</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="field" x="15" y="78">booking_code (UK)</text>
    <text class="fk" x="15" y="99">FK user_id</text>
    <text class="fk" x="15" y="120">FK room_id</text>
    <text class="fk" x="15" y="141">FK room_unit_id</text>
    <text class="field" x="15" y="162">check_in, check_out</text>
    <text class="field" x="15" y="183">total_guests, total_price</text>
    <text class="field" x="15" y="204">status: pending | paid | cancelled</text>
    <text class="field" x="15" y="225">        checked_in | checked_out</text>
    <text class="field" x="15" y="246">created_at, updated_at</text>
  </g>

  <!-- galleries -->
  <g transform="translate(850 330)">
    <rect class="box" width="230" height="135"/>
    <rect class="head" width="230" height="34"/>
    <text class="head-text" x="15" y="22">galleries</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="fk" x="15" y="78">FK room_id</text>
    <text class="field" x="15" y="99">image, caption</text>
    <text class="field" x="15" y="120">is_featured</text>
  </g>

  <!-- room facilities -->
  <g transform="translate(1080 330)">
    <rect class="box" width="180" height="125"/>
    <rect class="head" width="180" height="34"/>
    <text class="head-text" x="15" y="22">room_facilities</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="fk" x="15" y="78">FK room_id</text>
    <text class="fk" x="15" y="99">FK facility_id</text>
  </g>

  <!-- payments -->
  <g transform="translate(850 500)">
    <rect class="box" width="330" height="285"/>
    <rect class="head" width="330" height="34"/>
    <text class="head-text" x="15" y="22">payments</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="fk" x="15" y="78">FK user_id</text>
    <text class="fk" x="15" y="99">FK booking_id</text>
    <text class="fk" x="15" y="120">FK promo_id (nullable)</text>
    <text class="field" x="15" y="141">order_id, transaction_id</text>
    <text class="field" x="15" y="162">sub_total_amount, tax_amount</text>
    <text class="field" x="15" y="183">gross_amount</text>
    <text class="field" x="15" y="204">payment_type, payment_method</text>
    <text class="field" x="15" y="225">snap_token</text>
    <text class="field" x="15" y="246">transaction_status</text>
  </g>

  <!-- testimonials -->
  <g transform="translate(400 760)">
    <rect class="box" width="310" height="150"/>
    <rect class="head" width="310" height="34"/>
    <text class="head-text" x="15" y="22">testimonials</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="fk" x="15" y="78">FK user_id</text>
    <text class="fk" x="15" y="99">FK booking_id</text>
    <text class="field" x="15" y="120">review, rating, is_approved</text>
    <text class="field" x="15" y="141">created_at, updated_at</text>
  </g>

  <!-- promos -->
  <g transform="translate(1260 835)">
    <rect class="box" width="275" height="205"/>
    <rect class="head" width="275" height="34"/>
    <text class="head-text" x="15" y="22">promos</text>
    <text class="pk" x="15" y="57">PK id</text>
    <text class="field" x="15" y="78">code (UK), name</text>
    <text class="field" x="15" y="99">discount_type, discount_value</text>
    <text class="field" x="15" y="120">minimum_transaction</text>
    <text class="field" x="15" y="141">quota, used_count</text>
    <text class="field" x="15" y="162">start_date, end_date</text>
    <text class="field" x="15" y="183">is_active</text>
  </g>

  <text class="note" x="60" y="1100">Laravel infrastructure tables omitted: sessions, password_reset_tokens, cache, cache_locks, jobs, job_batches, failed_jobs.</text>
  <text class="note" x="60" y="1125">Booking availability uses room_unit_id, status, check_in, and check_out. Unit occupancy changes to occupied on checked_in.</text>
</svg>
